name: 🚀 Build Android Rust GDExtension (Omnara)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64-linux-android]
        target: [release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # ⚡ حفظ واسترجاع كاش NDK لعدم تحميله مجدداً ⚡
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.1.13356709
          key: ${{ runner.os }}-ndk-28.1.13356709

      - name: Install Android NDK 28 (if not cached)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.1.13356709"

      - name: Set NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> $GITHUB_ENV

      - name: Build Rust Library with cargo-ndk
        run: |
          cargo ndk --target ${{ matrix.arch }} build --release

      - name: Prepare Artifacts
        run: |
          mkdir -p godot_project/bin/android/arm64-v8a/
          cp target/${{ matrix.arch }}/release/*.so godot_project/bin/android/arm64-v8a/

      - name: Upload Android .so Library
        uses: actions/upload-artifact@v4
        with:
          name: omnara-android-${{ matrix.arch }}
          path: godot_project/bin/android/arm64-v8a/*.so
